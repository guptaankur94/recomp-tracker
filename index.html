<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recomp Tracker">
  <title>2-Month Body Recomp Tracker</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --card-alt: #2C2C2E;
      --accent: #30D158;
      --blue: #0A84FF;
      --text: #FFFFFF;
      --subtext: #8E8E93;
      --border: #38383A;
      --danger: #FF453A;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: env(safe-area-inset-top) 16px calc(80px + env(safe-area-inset-bottom)) 16px;
      touch-action: manipulation;
    }

    header {
      text-align: center;
      padding: 16px 0 12px 0;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin: 0; color: var(--accent); }
    .subtitle { font-size: 0.8rem; color: var(--subtext); margin-top: 4px; }

    /* Day Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }

    /* Card Styling */
    .day-header { margin-bottom: 16px; }
    .day-title { font-size: 1.2rem; font-weight: 700; color: var(--text); }
    
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .ex-name { font-size: 1.05rem; font-weight: 600; color: #FFF; }
    .alt-btn {
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--blue);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
    }
    .ex-meta {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .alt-text {
      font-size: 0.78rem;
      color: #FF9F0A;
      margin-bottom: 12px;
      display: none;
      padding: 6px 10px;
      background: rgba(255, 159, 10, 0.1);
      border-radius: 6px;
    }

    /* Set Rows */
    .set-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .set-num {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--subtext);
      width: 42px;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    input[type="number"] {
      width: 68px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-alt);
      color: #FFF;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .unit-label { font-size: 0.75rem; color: var(--subtext); }

    .timer-trigger-btn {
      background: var(--blue);
      color: #FFF;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-left: auto;
    }

    /* Sticky Rest Timer Banner */
    #timer-banner {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      left: 0; right: 0;
      background: var(--accent);
      color: #000;
      padding: 14px;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      display: none;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      z-index: 999;
    }
  </style>
</head>
<body>

  <header>
    <h1>RECOMP EXECUTION ENGINE</h1>
    <div class="subtitle">70kg Bodyweight Target | High-Protein Deficit</div>
  </header>

  <div class="nav-tabs" id="nav-tabs"></div>
  <div id="workout-content"></div>

  <div id="timer-banner">
    REST REMAINING: <span id="timer-seconds">0</span>s
  </div>

  <script>
    const programData = [
      {
        day: "Day 1",
        title: "Upper Chest & Heavy Biceps Focus",
        exercises: [
          {
            name: "Barbell Bench Press",
            alt: "Incline Dumbbell Press (12.5 kg DBs, 3s eccentric)",
            target: "3 sets × 8–10 reps | Target: 40–55 kg",
            rest: 180,
            sets: 3
          },
          {
            name: "Pec Deck Machine Flyes",
            alt: "Incline Dumbbell Flyes (10–12.5 kg DBs)",
            target: "3 sets × 10–12 reps | Target: Moderate",
            rest: 90,
            sets: 3
          },
          {
            name: "Barbell Bicep Curls",
            alt: "Standing Alt DB Curls (12.5 kg DBs)",
            target: "3 sets × 8–10 reps | Target: 20–27.5 kg",
            rest: 120,
            sets: 3
          },
          {
            name: "Incline Dumbbell Curls (45°)",
            alt: "Seated DB Curls (3-second lowering phase)",
            target: "3 sets × 8–10 reps | Target: 10–12.5 kg DBs",
            rest: 120,
            sets: 3
          },
          {
            name: "Barbell Reverse Curls",
            alt: "Cross-Body DB Hammer Curls (10–12.5 kg DBs)",
            target: "3 sets × 8–10 reps | Target: 15–22.5 kg",
            rest: 90,
            sets: 3
          }
        ]
      },
      {
        day: "Day 2",
        title: "Lower Body & Core Focus",
        exercises: [
          {
            name: "Leg Press Machine",
            alt: "Barbell Squats (35–50 kg total bar)",
            target: "3 sets × 10–12 reps | Target: Moderate-Heavy",
            rest: 150,
            sets: 3
          },
          {
            name: "Barbell Romanian Deadlifts",
            alt: "Single-Leg DB RDLs (12.5 kg DB in hand)",
            target: "3 sets × 8–10 reps | Target: 45–60 kg",
            rest: 180,
            sets: 3
          },
          {
            name: "Single-Leg DB Calf Raise",
            alt: "Standing Barbell Calf Raise (Balls of feet on plate)",
            target: "3 sets × 12–15 reps | Target: 10–12.5 kg DB",
            rest: 90,
            sets: 3
          },
          {
            name: "Hanging Leg Raises / Knee Raises",
            alt: "Incline Bench Crunches or 60s Planks",
            target: "3 sets × 12–15 reps | Target: Bodyweight",
            rest: 60,
            sets: 3
          }
        ]
      },
      {
        day: "Day 3",
        title: "Shoulders & Heavy Triceps Focus",
        exercises: [
          {
            name: "Barbell Overhead Shoulder Press",
            alt: "Seated DB Overhead Press (12.5 kg DBs)",
            target: "3 sets × 8–10 reps | Target: 30–40 kg",
            rest: 180,
            sets: 3
          },
          {
            name: "Standing Dumbbell Lateral Raises",
            alt: "Single-Arm DB Lateral Raises (Leaning off rack)",
            target: "4 sets × 12–15 reps | Target: 7.5–10 kg DBs",
            rest: 90,
            sets: 4
          },
          {
            name: "Close-Grip Barbell Bench Press",
            alt: "Weighted Bench Dips (10–15 kg plate on lap)",
            target: "3 sets × 6–8 reps | Target: 35–45 kg",
            rest: 180,
            sets: 3
          },
          {
            name: "Seated 60° Incline DB Overhead Ext",
            alt: "Seated Barbell French Press (20–25 kg bar)",
            target: "3 sets × 8–12 reps | Target: Single 12.5–15 kg DB",
            rest: 120,
            sets: 3
          },
          {
            name: "Incline DB Skullcrushers (30°)",
            alt: "Lying Barbell Skullcrushers (17.5–22.5 kg bar)",
            target: "3 sets × 10–12 reps | Target: 10–12.5 kg DBs",
            rest: 120,
            sets: 3
          }
        ]
      },
      {
        day: "Day 4",
        title: "Back & Lower Arm Width (Brachialis)",
        exercises: [
          {
            name: "Lat Pulldown Machine",
            alt: "Bodyweight Pull-ups / Negative Pull-ups",
            target: "3 sets × 8–10 reps | Target: Moderate-Heavy",
            rest: 120,
            sets: 3
          },
          {
            name: "Barbell Bent-Over Rows",
            alt: "Single-Arm DB Rows (12.5 kg DB, 3s eccentric)",
            target: "3 sets × 8–10 reps | Target: 40–55 kg",
            rest: 180,
            sets: 3
          },
          {
            name: "Cross-Body DB Hammer Curls",
            alt: "Incline Neutral-Grip DB Curls (10–12.5 kg DBs)",
            target: "3 sets × 8–10 reps | Target: 10–12.5 kg DBs",
            rest: 90,
            sets: 3
          },
          {
            name: "Heavy DB Farmer’s Carries",
            alt: "Barbell Static Grip Hold (50 kg bar for 45s)",
            target: "3 sets × 45-second walks | Target: 12.5 kg DBs",
            rest: 90,
            sets: 3
          }
        ]
      },
      {
        day: "Day 5",
        title: "Chest Definition & Arm Hypertrophy",
        exercises: [
          {
            name: "Pec Deck Machine Flyes",
            alt: "Flat Dumbbell Flyes (10–12.5 kg DBs)",
            target: "3 sets × 12–15 reps | Target: Moderate",
            rest: 90,
            sets: 3
          },
          {
            name: "Barbell Pullovers",
            alt: "Single DB Pullover (12.5 kg DB cupped)",
            target: "3 sets × 10–12 reps | Target: 15–22.5 kg",
            rest: 90,
            sets: 3
          },
          {
            name: "Standing DB Bicep Curls (Supinating)",
            alt: "Barbell 21s (7 lower, 7 upper, 7 full reps)",
            target: "3 sets × 10–12 reps | Target: 10–12.5 kg DBs",
            rest: 90,
            sets: 3
          },
          {
            name: "Bench Dips (Lower Chest & Tricep)",
            alt: "Overhand DB Tricep Kickbacks (7.5–10 kg DBs)",
            target: "3 sets × 10–12 reps | Target: BW + 10 kg plate",
            rest: 90,
            sets: 3
          },
          {
            name: "Bodyweight Push-ups",
            alt: "Decline Push-ups (Feet elevated on bench)",
            target: "2 sets × Technical Failure | Target: Bodyweight",
            rest: 75,
            sets: 2
          }
        ]
      }
    ];

    let currentDayIdx = 0;
    let timerCountdown = null;

    function initNav() {
      const navContainer = document.getElementById('nav-tabs');
      navContainer.innerHTML = programData.map((d, i) => `
        <button class="tab-btn ${i === currentDayIdx ? 'active' : ''}" onclick="selectDay(${i})">
          ${d.day}
        </button>
      `).join('');
    }

    function selectDay(idx) {
      currentDayIdx = idx;
      initNav();
      renderWorkout();
    }

    function renderWorkout() {
      const main = document.getElementById('workout-content');
      const data = programData[currentDayIdx];

      let html = `
        <div class="day-header">
          <div class="day-title">${data.day}: ${data.title}</div>
        </div>
      `;

      data.exercises.forEach((ex, exIdx) => {
        html += `
          <div class="card">
            <div class="ex-header">
              <span class="ex-name">${ex.name}</span>
              <button class="alt-btn" onclick="toggleAlt(${exIdx})">Swap Alt</button>
            </div>
            <div class="ex-meta">${ex.target}</div>
            <div class="alt-text" id="alt-${exIdx}">Smart Alt: ${ex.alt}</div>
        `;

        for (let s = 1; s <= ex.sets; s++) {
          const wKey = `d${currentDayIdx}_e${exIdx}_s${s}_w`;
          const rKey = `d${currentDayIdx}_e${exIdx}_s${s}_r`;
          const valW = localStorage.getItem(wKey) || '';
          const valR = localStorage.getItem(rKey) || '';

          html += `
            <div class="set-row">
              <span class="set-num">Set ${s}</span>
              <div class="input-group">
                <input type="number" step="0.5" placeholder="0" value="${valW}" onchange="saveVal('${wKey}', this.value)">
                <span class="unit-label">kg</span>
              </div>
              <div class="input-group">
                <input type="number" placeholder="0" value="${valR}" onchange="saveVal('${rKey}', this.value)">
                <span class="unit-label">reps</span>
              </div>
              <button class="timer-trigger-btn" onclick="triggerRestTimer(${ex.rest})">Rest ${ex.rest}s</button>
            </div>
          `;
        }

        html += `</div>`;
      });

      main.innerHTML = html;
    }

    function toggleAlt(exIdx) {
      const el = document.getElementById(`alt-${exIdx}`);
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function saveVal(key, value) {
      localStorage.setItem(key, value);
    }

    function triggerRestTimer(seconds) {
      clearInterval(timerCountdown);
      const banner = document.getElementById('timer-banner');
      const display = document.getElementById('timer-seconds');
      
      banner.style.display = 'block';
      let remaining = seconds;
      display.innerText = remaining;

      timerCountdown = setInterval(() => {
        remaining--;
        display.innerText = remaining;
        if (remaining <= 0) {
          clearInterval(timerCountdown);
          banner.style.display = 'none';
          
          // Audio Beep Cue using Web Audio API (iOS Compatible)
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } catch(e){}

          if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
          }
        }
      }, 1000);
    }

    // Initialize App
    initNav();
    renderWorkout();
  </script>
</body>
</html>
