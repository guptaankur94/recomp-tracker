<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recomp Engine">
  <title>2-Month Recomp Execution Engine</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --card-alt: #2C2C2E;
      --accent: #30D158;
      --blue: #0A84FF;
      --text: #FFFFFF;
      --subtext: #8E8E93;
      --border: #38383A;
      --danger: #FF453A;
      --orange: #FF9F0A;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: env(safe-area-inset-top) 16px calc(110px + env(safe-area-inset-bottom)) 16px;
      touch-action: manipulation;
    }

    header {
      text-align: center;
      padding: 12px 0 8px 0;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin: 0; color: var(--accent); }
    .subtitle { font-size: 0.78rem; color: var(--subtext); margin-top: 2px; }

    /* Top Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      text-align: center;
    }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: #FFF; }
    .stat-lbl { font-size: 0.65rem; color: var(--subtext); text-transform: uppercase; margin-top: 2px; }

    /* Day Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 8px 14px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 0.82rem;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Exercise Cards */
    .day-header { margin-bottom: 12px; }
    .day-title { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .ex-name { font-size: 1rem; font-weight: 600; color: #FFF; }
    .alt-btn {
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--blue);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .alt-text {
      font-size: 0.75rem;
      color: var(--orange);
      margin-bottom: 10px;
      display: none;
      padding: 6px 8px;
      background: rgba(255, 159, 10, 0.1);
      border-radius: 6px;
    }

    /* Set Container & Rows */
    .set-container { margin-top: 10px; }
    .set-block {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .set-block.completed {
      border-color: var(--accent);
      background: rgba(48, 209, 88, 0.05);
    }
    .set-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    /* Set Label & Done Badge */
    .set-label-btn {
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--subtext);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .set-block.completed .set-label-btn {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .input-group { display: flex; align-items: center; gap: 3px; }
    
    input[type="number"] {
      width: 54px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-alt);
      color: #FFF;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    input[type="number"].rest-input {
      width: 48px;
      border-color: var(--blue);
      color: #30D158;
    }

    .unit-label { font-size: 0.68rem; color: var(--subtext); }

    .timer-trigger-btn {
      background: var(--blue);
      color: #FFF;
      border: none;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-left: auto;
    }

    .delete-set-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.9rem;
      font-weight: bold;
      padding: 4px 6px;
      cursor: pointer;
    }

    /* Reference Hint Text Below Inputs */
    .set-hint {
      font-size: 0.72rem;
      color: var(--subtext);
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
    }
    .set-hint strong { color: #E5E5EA; }

    /* Action Buttons */
    .add-set-btn {
      width: 100%;
      background: var(--card-alt);
      border: 1px dashed var(--blue);
      color: var(--blue);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 4px;
      cursor: pointer;
    }

    .add-custom-ex-btn {
      width: 100%;
      background: var(--card);
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: center;
    }

    .finish-workout-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    /* Calendar & History Styles */
    .calendar-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
      text-align: center;
    }
    .cal-day-head { font-size: 0.7rem; color: var(--subtext); font-weight: 600; }
    .cal-date {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      background: var(--card-alt);
      color: #8E8E93;
      padding: 2px;
    }
    .cal-date.active-logged {
      background: rgba(48, 209, 88, 0.2);
      border: 1px solid var(--accent);
      color: #FFF;
    }
    .cal-subtext {
      font-size: 0.58rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 1px;
      line-height: 1;
    }
    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .history-info-title { font-size: 0.95rem; font-weight: 600; color: #FFF; }
    .history-info-date { font-size: 0.75rem; color: var(--subtext); margin-top: 2px; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
    .modal-date { font-size: 0.8rem; color: var(--subtext); margin-bottom: 12px; }
    .modal-close-btn {
      width: 100%;
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: #FFF;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      margin-top: 10px;
    }
    .modal-delete-btn {
      width: 100%;
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      margin-top: 10px;
    }

    /* Fixed Bottom iOS Tab Bar */
    .bottom-tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 8px;
      z-index: 900;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--subtext);
      font-size: 0.68rem;
      font-weight: 600;
      border: none;
      background: none;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item-icon { font-size: 1.2rem; }

    /* Rest Timer Banner & Controls */
    #timer-banner {
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom));
      left: 0; right: 0;
      background: var(--accent);
      color: #000;
      padding: 10px 14px;
      display: none;
      z-index: 850;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }
    .timer-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-text { font-size: 1rem; font-weight: 800; }
    .timer-btn-group { display: flex; gap: 6px; }
    .timer-ctrl-btn {
      background: #000;
      color: #FFF;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .timer-ctrl-btn.skip-btn {
      background: var(--danger);
      color: #FFF;
    }
  </style>
</head>
<body>

  <header>
    <h1>RECOMP EXECUTION ENGINE</h1>
    <div class="subtitle">70kg Bodyweight Target | Recomposition Split</div>
  </header>

  <!-- Top Metric Bar -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-val" id="stat-total-workouts">0</div>
      <div class="stat-lbl">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-streak">0 Sessions</div>
      <div class="stat-lbl">Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color: var(--accent);">70 kg</div>
      <div class="stat-lbl">Target Frame</div>
    </div>
  </div>

  <!-- Main View Container -->
  <div id="view-workout">
    <div class="nav-tabs" id="day-nav-tabs"></div>
    <div id="workout-content"></div>
  </div>

  <div id="view-history" style="display: none;">
    <div class="calendar-card">
      <div style="font-weight: 700; font-size: 1rem; margin-bottom: 8px;" id="calendar-month-title">Calendar</div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
    <div style="font-weight: 700; font-size: 1rem; margin-bottom: 10px;">Logged Workout Sessions</div>
    <div id="history-list-container"></div>
  </div>

  <div id="view-settings" style="display: none;">
    <div class="card">
      <div style="font-weight: 700; margin-bottom: 8px;">Backup & Data Storage</div>
      <div style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 12px;">All workout data is saved locally on your iPhone browser.</div>
      <button class="modal-close-btn" onclick="exportData()" style="background: var(--blue); color:#FFF; margin-top:0; margin-bottom:8px;">Export Backup (JSON)</button>
      <button class="modal-close-btn" onclick="clearAllData()" style="background: rgba(255,69,58,0.15); color: var(--danger); border-color: var(--danger);">Reset All Local Logs</button>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">Session Details</div>
      <div class="modal-date" id="modal-date">Date</div>
      <div id="modal-body"></div>
      <button class="modal-delete-btn" id="modal-delete-action-btn">Delete Workout Session</button>
      <button class="modal-close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- Rest Timer Banner -->
  <div id="timer-banner">
    <div class="timer-flex">
      <div class="timer-text">REST: <span id="timer-seconds">0</span>s</div>
      <div class="timer-btn-group">
        <button class="timer-ctrl-btn" onclick="adjustTimerSeconds(-10)">-10s</button>
        <button class="timer-ctrl-btn" onclick="adjustTimerSeconds(10)">+10s</button>
        <button class="timer-ctrl-btn skip-btn" onclick="stopRestTimer(true)">Skip</button>
      </div>
    </div>
  </div>

  <!-- Fixed iOS Bottom Navigation Bar -->
  <div class="bottom-tab-bar">
    <button class="nav-item active" id="tab-nav-workout" onclick="switchView('workout')">
      <span class="nav-item-icon">🏋️</span>
      Workout
    </button>
    <button class="nav-item" id="tab-nav-history" onclick="switchView('history')">
      <span class="nav-item-icon">📅</span>
      Calendar
    </button>
    <button class="nav-item" id="tab-nav-settings" onclick="switchView('settings')">
      <span class="nav-item-icon">⚙️</span>
      Data
    </button>
  </div>

  <script>
    const programData = [
      {
        day: "Day 1",
        title: "Upper Chest & Heavy Biceps Focus",
        exercises: [
          { name: "Barbell Bench Press", alt: "Incline DB Press (12.5 kg DBs, 3s eccentric)", repTarget: "8–10 reps", weightTarget: "40–55 kg", rest: 180, sets: 3 },
          { name: "Pec Deck Machine Flyes", alt: "Incline DB Flyes (10–12.5 kg DBs)", repTarget: "10–12 reps", weightTarget: "Moderate", rest: 90, sets: 3 },
          { name: "Barbell Bicep Curls", alt: "Standing Alt DB Curls (12.5 kg DBs)", repTarget: "8–10 reps", weightTarget: "20–27.5 kg", rest: 120, sets: 3 },
          { name: "Incline DB Curls (45°)", alt: "Seated DB Curls (3-second lowering)", repTarget: "8–10 reps", weightTarget: "10–12.5 kg DBs", rest: 120, sets: 3 },
          { name: "Barbell Reverse Curls", alt: "Cross-Body DB Hammer Curls (10–12.5 kg)", repTarget: "8–10 reps", weightTarget: "15–22.5 kg", rest: 90, sets: 3 }
        ]
      },
      {
        day: "Day 2",
        title: "Lower Body & Core Focus",
        exercises: [
          { name: "Leg Press Machine", alt: "Barbell Squats (35–50 kg total bar)", repTarget: "10–12 reps", weightTarget: "Moderate-Heavy", rest: 150, sets: 3 },
          { name: "Barbell Romanian Deadlifts", alt: "Single-Leg DB RDLs (12.5 kg DB)", repTarget: "8–10 reps", weightTarget: "45–60 kg", rest: 180, sets: 3 },
          { name: "Single-Leg DB Calf Raise", alt: "Standing Barbell Calf Raise", repTarget: "12–15 reps", weightTarget: "10–12.5 kg DB", rest: 90, sets: 3 },
          { name: "Hanging Leg Raises / Knee Raises", alt: "Incline Crunches or 60s Planks", repTarget: "12–15 reps", weightTarget: "Bodyweight", rest: 60, sets: 3 }
        ]
      },
      {
        day: "Day 3",
        title: "Shoulders & Heavy Triceps Focus",
        exercises: [
          { name: "Barbell Overhead Shoulder Press", alt: "Seated DB Overhead Press (12.5 kg)", repTarget: "8–10 reps", weightTarget: "30–40 kg", rest: 180, sets: 3 },
          { name: "Standing DB Lateral Raises", alt: "Single-Arm DB Lateral Raises", repTarget: "12–15 reps", weightTarget: "7.5–10 kg DBs", rest: 90, sets: 4 },
          { name: "Close-Grip Barbell Bench Press", alt: "Weighted Bench Dips (10–15 kg plate)", repTarget: "6–8 reps", weightTarget: "35–45 kg", rest: 180, sets: 3 },
          { name: "Seated 60° Incline DB Overhead Ext", alt: "Seated Barbell French Press", repTarget: "8–12 reps", weightTarget: "Single 12.5–15 kg", rest: 120, sets: 3 },
          { name: "Incline DB Skullcrushers (30°)", alt: "Lying Barbell Skullcrushers", repTarget: "10–12 reps", weightTarget: "10–12.5 kg DBs", rest: 120, sets: 3 }
        ]
      },
      {
        day: "Day 4",
        title: "Back & Lower Arm Width",
        exercises: [
          { name: "Lat Pulldown Machine", alt: "Bodyweight Pull-ups / Negative Pull-ups", repTarget: "8–10 reps", weightTarget: "Moderate-Heavy", rest: 120, sets: 3 },
          { name: "Barbell Bent-Over Rows", alt: "Single-Arm DB Rows (12.5 kg DB)", repTarget: "8–10 reps", weightTarget: "40–55 kg", rest: 180, sets: 3 },
          { name: "Cross-Body DB Hammer Curls", alt: "Incline Neutral-Grip DB Curls", repTarget: "8–10 reps", weightTarget: "10–12.5 kg DBs", rest: 90, sets: 3 },
          { name: "Heavy DB Farmer’s Carries", alt: "Barbell Static Grip Hold (50 kg bar)", repTarget: "45s walks", weightTarget: "12.5 kg DBs", rest: 90, sets: 3 }
        ]
      },
      {
        day: "Day 5",
        title: "Chest Definition & Arm Pump",
        exercises: [
          { name: "Pec Deck Machine Flyes", alt: "Flat DB Flyes (10–12.5 kg DBs)", repTarget: "12–15 reps", weightTarget: "Moderate", rest: 90, sets: 3 },
          { name: "Barbell Pullovers", alt: "Single DB Pullover (12.5 kg DB)", repTarget: "10–12 reps", weightTarget: "15–22.5 kg", rest: 90, sets: 3 },
          { name: "Standing DB Bicep Curls", alt: "Barbell 21s", repTarget: "10–12 reps", weightTarget: "10–12.5 kg DBs", rest: 90, sets: 3 },
          { name: "Bench Dips", alt: "Overhand DB Tricep Kickbacks", repTarget: "10–12 reps", weightTarget: "BW + 10 kg plate", rest: 90, sets: 3 },
          { name: "Bodyweight Push-ups", alt: "Decline Push-ups (Feet elevated)", repTarget: "Failure", weightTarget: "Bodyweight", rest: 75, sets: 2 }
        ]
      }
    ];

    let currentDayIdx = 0;
    let timerCountdown = null;
    let timerSecondsRemaining = 0;

    function getHistory() {
      return JSON.parse(localStorage.getItem('recomp_history') || '[]');
    }

    function saveHistory(historyArr) {
      localStorage.setItem('recomp_history', JSON.stringify(historyArr));
      updateStats();
    }

    function updateStats() {
      const history = getHistory();
      document.getElementById('stat-total-workouts').innerText = history.length;
      document.getElementById('stat-streak').innerText = `${history.length > 0 ? history.length : 0} Sessions`;
    }

    function getSetCount(dayIdx, exIdx, defaultSets) {
      const stored = localStorage.getItem(`d${dayIdx}_e${exIdx}_setcount`);
      return stored ? parseInt(stored, 10) : defaultSets;
    }

    function saveSetCount(dayIdx, exIdx, count) {
      localStorage.setItem(`d${dayIdx}_e${exIdx}_setcount`, count);
    }

    /* Custom Exercises Logic */
    function getCustomExercises(dayIdx) {
      return JSON.parse(localStorage.getItem(`custom_ex_d${dayIdx}`) || '[]');
    }

    function addCustomExercise() {
      const exName = prompt("Enter Extra Exercise Name:");
      if (!exName || !exName.trim()) return;

      const customs = getCustomExercises(currentDayIdx);
      customs.push({
        name: exName.trim(),
        alt: "Custom Exercise",
        repTarget: "8–12 reps",
        weightTarget: "Custom",
        rest: 90,
        sets: 3,
        isCustom: true
      });
      localStorage.setItem(`custom_ex_d${currentDayIdx}`, JSON.stringify(customs));
      renderWorkout();
    }

    function getAllExercisesForDay(dayIdx) {
      const base = programData[dayIdx].exercises;
      const customs = getCustomExercises(dayIdx);
      return [...base, ...customs];
    }

    function initNav() {
      const navContainer = document.getElementById('day-nav-tabs');
      navContainer.innerHTML = programData.map((d, i) => `
        <button class="tab-btn ${i === currentDayIdx ? 'active' : ''}" onclick="selectDay(${i})">
          ${d.day}
        </button>
      `).join('');
    }

    function selectDay(idx) {
      currentDayIdx = idx;
      initNav();
      renderWorkout();
    }

    function renderWorkout() {
      const main = document.getElementById('workout-content');
      const data = programData[currentDayIdx];
      const allExercises = getAllExercisesForDay(currentDayIdx);

      let html = `
        <div class="day-header">
          <div class="day-title">${data.day}: ${data.title}</div>
        </div>
      `;

      allExercises.forEach((ex, exIdx) => {
        const totalSets = getSetCount(currentDayIdx, exIdx, ex.sets);

        html += `
          <div class="card">
            <div class="ex-header">
              <span class="ex-name">${ex.name} ${ex.isCustom ? '<span style="font-size:0.7rem; color:var(--accent);">(Extra)</span>' : ''}</span>
              <button class="alt-btn" onclick="toggleAlt(${exIdx})">Swap Alt</button>
            </div>
            <div class="alt-text" id="alt-${exIdx}">Smart Alt: ${ex.alt}</div>
            <div class="set-container">
        `;

        for (let s = 1; s <= totalSets; s++) {
          const wKey = `active_d${currentDayIdx}_e${exIdx}_s${s}_w`;
          const rKey = `active_d${currentDayIdx}_e${exIdx}_s${s}_r`;
          const restKey = `active_d${currentDayIdx}_e${exIdx}_s${s}_rest`;
          const doneKey = `active_d${currentDayIdx}_e${exIdx}_s${s}_done`;

          const valW = localStorage.getItem(wKey) || '';
          const valR = localStorage.getItem(rKey) || '';
          const valRest = localStorage.getItem(restKey) || ex.rest;
          const isDone = localStorage.getItem(doneKey) === 'true';

          html += `
            <div class="set-block ${isDone ? 'completed' : ''}" id="block_d${currentDayIdx}_e${exIdx}_s${s}">
              <div class="set-row">
                <button class="set-label-btn" onclick="toggleSetDone(${exIdx}, ${s})">
                  ${isDone ? '✓ Set' : 'Set'} ${s}
                </button>
                
                <div class="input-group">
                  <input type="number" id="${wKey}" step="0.5" placeholder="0" value="${valW}" onchange="saveVal('${wKey}', this.value)">
                  <span class="unit-label">kg</span>
                </div>

                <div class="input-group">
                  <input type="number" id="${rKey}" placeholder="0" value="${valR}" onchange="saveVal('${rKey}', this.value)">
                  <span class="unit-label">reps</span>
                </div>

                <div class="input-group">
                  <input type="number" id="${restKey}" class="rest-input" value="${valRest}" onchange="saveVal('${restKey}', this.value)">
                  <span class="unit-label">s</span>
                </div>

                <button class="timer-trigger-btn" onclick="triggerRestTimerFromInput('${restKey}', ${exIdx}, ${s})">▶ Rest</button>

                ${totalSets > 1 ? `<button class="delete-set-btn" onclick="removeSet(${exIdx},${s})" title="Delete Set">✕</button>` : ''}
              </div>

              <div class="set-hint">
                <span>💡 Target: <strong>${ex.repTarget} @ ${ex.weightTarget}</strong></span>
                <span>Rec Rest: <strong>${ex.rest}s</strong></span>
              </div>
            </div>
          `;
        }

        html += `
            </div>
            <button class="add-set-btn" onclick="addSet(${exIdx})">+ Add Set</button>
          </div>
        `;
      });

      html += `
        <button class="add-custom-ex-btn" onclick="addCustomExercise()">+ Add Custom Extra Exercise</button>
        <button class="finish-workout-btn" onclick="finishAndSaveWorkout()">Finish & Save ${data.day} Workout</button>
      `;
      main.innerHTML = html;
    }

    function toggleAlt(exIdx) {
      const el = document.getElementById(`alt-${exIdx}`);
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function saveVal(key, value) {
      localStorage.setItem(key, value);
    }

    function toggleSetDone(exIdx, setNum) {
      const doneKey = `active_d${currentDayIdx}_e${exIdx}_s${setNum}_done`;
      const currentState = localStorage.getItem(doneKey) === 'true';
      localStorage.setItem(doneKey, (!currentState).toString());
      renderWorkout();
    }

    function addSet(exIdx) {
      const allExercises = getAllExercisesForDay(currentDayIdx);
      const currentCount = getSetCount(currentDayIdx, exIdx, allExercises[exIdx].sets);
      saveSetCount(currentDayIdx, exIdx, currentCount + 1);
      renderWorkout();
    }

    function removeSet(exIdx, setNum) {
      const allExercises = getAllExercisesForDay(currentDayIdx);
      const currentCount = getSetCount(currentDayIdx, exIdx, allExercises[exIdx].sets);
      if (currentCount <= 1) return;

      for (let s = setNum; s < currentCount; s++) {
        const nextW = localStorage.getItem(`active_d${currentDayIdx}_e${exIdx}_s${s+1}_w`) || '';
        const nextR = localStorage.getItem(`active_d${currentDayIdx}_e${exIdx}_s${s+1}_r`) || '';
        const nextRest = localStorage.getItem(`active_d${currentDayIdx}_e${exIdx}_s${s+1}_rest`) || '';
        const nextDone = localStorage.getItem(`active_d${currentDayIdx}_e${exIdx}_s${s+1}_done`) || '';

        localStorage.setItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_w`, nextW);
        localStorage.setItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_r`, nextR);
        localStorage.setItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_rest`, nextRest);
        localStorage.setItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_done`, nextDone);
      }

      localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${currentCount}_w`);
      localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${currentCount}_r`);
      localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${currentCount}_rest`);
      localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${currentCount}_done`);

      saveSetCount(currentDayIdx, exIdx, currentCount - 1);
      renderWorkout();
    }

    function triggerRestTimerFromInput(restKey, exIdx, setNum) {
      localStorage.setItem(`active_d${currentDayIdx}_e${exIdx}_s${setNum}_done`, 'true');
      renderWorkout();

      const inputEl = document.getElementById(restKey);
      const seconds = inputEl ? parseInt(inputEl.value, 10) : 90;
      startRestTimer(isNaN(seconds) ? 90 : seconds);
    }

    function startRestTimer(seconds) {
      clearInterval(timerCountdown);
      const banner = document.getElementById('timer-banner');
      const display = document.getElementById('timer-seconds');
      
      timerSecondsRemaining = seconds;
      banner.style.display = 'block';
      display.innerText = timerSecondsRemaining;

      timerCountdown = setInterval(() => {
        timerSecondsRemaining--;
        display.innerText = timerSecondsRemaining;
        if (timerSecondsRemaining <= 0) {
          stopRestTimer(false);
        }
      }, 1000);
    }

    function adjustTimerSeconds(delta) {
      timerSecondsRemaining = Math.max(0, timerSecondsRemaining + delta);
      document.getElementById('timer-seconds').innerText = timerSecondsRemaining;
      if (timerSecondsRemaining <= 0) {
        stopRestTimer(false);
      }
    }

    function stopRestTimer(isSkip) {
      clearInterval(timerCountdown);
      document.getElementById('timer-banner').style.display = 'none';

      if (!isSkip) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } catch(e){}
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    }

    function finishAndSaveWorkout() {
      const dayData = programData[currentDayIdx];
      const allExercises = getAllExercisesForDay(currentDayIdx);

      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];
      const displayDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      const loggedExercises = [];

      allExercises.forEach((ex, exIdx) => {
        const totalSets = getSetCount(currentDayIdx, exIdx, ex.sets);
        const performedSets = [];

        for (let s = 1; s <= totalSets; s++) {
          const wKey = `active_d${currentDayIdx}_e${exIdx}_s${s}_w`;
          const rKey = `active_d${currentDayIdx}_e${exIdx}_s${s}_r`;
          const restKey = `active_d${currentDayIdx}_e${exIdx}_s${s}_rest`;

          const weightVal = parseFloat(localStorage.getItem(wKey) || '0');
          const repsVal = parseInt(localStorage.getItem(rKey) || '0', 10);
          const restVal = parseInt(localStorage.getItem(restKey) || ex.rest.toString(), 10);

          if (repsVal > 0 || weightVal > 0) {
            performedSets.push({
              set: s,
              weight: weightVal,
              reps: repsVal,
              restSec: restVal
            });
          }
        }

        if (performedSets.length > 0) {
          loggedExercises.push({
            name: ex.name,
            sets: performedSets
          });
        }
      });

      if (loggedExercises.length === 0) {
        alert("Please enter weights and reps for at least one exercise before saving!");
        return;
      }

      const sessionObj = {
        id: Date.now(),
        dateStr: dateStr,
        displayDate: displayDate,
        day: dayData.day,
        title: dayData.title,
        exercises: loggedExercises
      };

      const history = getHistory();
      history.unshift(sessionObj);
      saveHistory(history);

      // Reset active session inputs and custom exercises for this day
      allExercises.forEach((ex, exIdx) => {
        const totalSets = getSetCount(currentDayIdx, exIdx, ex.sets);
        for (let s = 1; s <= totalSets; s++) {
          localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_w`);
          localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_r`);
          localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_rest`);
          localStorage.removeItem(`active_d${currentDayIdx}_e${exIdx}_s${s}_done`);
        }
      });
      localStorage.removeItem(`custom_ex_d${currentDayIdx}`);

      renderWorkout();
      alert(`${dayData.day} Workout Logged Successfully! 🎉`);
      switchView('history');
    }

    function switchView(viewName) {
      document.getElementById('view-workout').style.display = viewName === 'workout' ? 'block' : 'none';
      document.getElementById('view-history').style.display = viewName === 'history' ? 'block' : 'none';
      document.getElementById('view-settings').style.display = viewName === 'settings' ? 'block' : 'none';

      document.getElementById('tab-nav-workout').classList.toggle('active', viewName === 'workout');
      document.getElementById('tab-nav-history').classList.toggle('active', viewName === 'history');
      document.getElementById('tab-nav-settings').classList.toggle('active', viewName === 'settings');

      if (viewName === 'history') {
        renderCalendarAndHistory();
      }
    }

    function renderCalendarAndHistory() {
      const history = getHistory();
      const historyContainer = document.getElementById('history-list-container');
      
      if (history.length === 0) {
        historyContainer.innerHTML = `<div style="font-size:0.85rem; color: var(--subtext); text-align:center; padding: 20px;">No workout sessions logged yet. Complete a workout to see your history!</div>`;
      } else {
        historyContainer.innerHTML = history.map(item => `
          <div class="history-card" onclick="openSessionModal(${item.id})">
            <div>
              <div class="history-info-title">${item.day}: ${item.title}</div>
              <div class="history-info-date">${item.displayDate} • ${item.exercises.length} Exercises</div>
            </div>
            <div style="color: var(--blue); font-weight: 600; font-size: 0.8rem;">View Details ›</div>
          </div>
        `).join('');
      }

      // Render Calendar Grid with Subtext Badges
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const monthName = now.toLocaleString('default', { month: 'long' });
      document.getElementById('calendar-month-title').innerText = `${monthName} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Map sessions to dates
      const dateMap = {};
      history.forEach(h => {
        if (!dateMap[h.dateStr]) dateMap[h.dateStr] = [];
        // Extract Day short code like "D1", "D5"
        const shortDay = h.day.replace('Day ', 'D');
        if (!dateMap[h.dateStr].includes(shortDay)) {
          dateMap[h.dateStr].push(shortDay);
        }
      });

      let calHtml = `
        <div class="cal-day-head">S</div><div class="cal-day-head">M</div><div class="cal-day-head">T</div>
        <div class="cal-day-head">W</div><div class="cal-day-head">T</div><div class="cal-day-head">F</div><div class="cal-day-head">S</div>
      `;

      for (let i = 0; i < firstDay; i++) {
        calHtml += `<div></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const loggedDays = dateMap[dStr];
        const isLogged = !!loggedDays;
        const subtext = isLogged ? loggedDays.join(',') : '';

        calHtml += `
          <div class="cal-date ${isLogged ? 'active-logged' : ''}">
            <span>${d}</span>
            ${isLogged ? `<span class="cal-subtext">${subtext}</span>` : ''}
          </div>
        `;
      }

      document.getElementById('calendar-grid').innerHTML = calHtml;
    }

    function openSessionModal(sessionId) {
      const history = getHistory();
      const session = history.find(s => s.id === sessionId);
      if (!session) return;

      document.getElementById('modal-title').innerText = `${session.day}: ${session.title}`;
      document.getElementById('modal-date').innerText = session.displayDate;

      let bodyHtml = '';
      session.exercises.forEach(ex => {
        bodyHtml += `
          <div style="margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
            <div style="font-weight: 600; font-size: 0.95rem; color: #FFF; margin-bottom: 4px;">${ex.name}</div>
            <div style="font-size: 0.8rem; color: var(--subtext); line-height: 1.4;">
              ${ex.sets.map(s => `Set ${s.set}: <strong style="color:#FFF;">${s.weight} kg</strong> × <strong style="color:#FFF;">${s.reps} reps</strong> <span style="color:var(--accent); font-size:0.72rem;">(Rest ${s.restSec}s)</span>`).join('<br>')}
            </div>
          </div>
        `;
      });

      document.getElementById('modal-body').innerHTML = bodyHtml;

      // Bind Delete Button Action
      const deleteBtn = document.getElementById('modal-delete-action-btn');
      deleteBtn.onclick = () => deleteSession(sessionId);

      document.getElementById('detail-modal').style.display = 'flex';
    }

    function deleteSession(sessionId) {
      if (confirm("Are you sure you want to delete this workout session from your logs?")) {
        let history = getHistory();
        history = history.filter(s => s.id !== sessionId);
        saveHistory(history);
        closeModal();
        renderCalendarAndHistory();
        alert("Workout session deleted.");
      }
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }

    function exportData() {
      const history = getHistory();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(history, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "recomp_workout_history.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function clearAllData() {
      if (confirm("Are you sure you want to delete all saved local workout logs?")) {
        localStorage.clear();
        updateStats();
        renderCalendarAndHistory();
        renderWorkout();
        alert("All local data has been reset.");
      }
    }

    // Init App
    initNav();
    renderWorkout();
    updateStats();
  </script>
</body>
</html>
